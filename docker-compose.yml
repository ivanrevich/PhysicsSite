version: "3.8"
services:

  client-backend:
    image: backend:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - service-db
    environment:
      - SERVER_PORT = 8080
    volumes:
      - files:src/main/resources/static/files
volumes:
  files: