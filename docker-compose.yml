version: '3.8'
services:
  client-frontend:
    image: frontend:0.0.1
    build:
      context: ./frontend/
      dockerfile: ./frontend/Dockerfile
    restart: always
    ports:
      - '3005:3005'
    volumes:
      - /frontapp/node_modules
      - ./frontend:/frontapp


  service-db:
    image: postgres:14.7-alpine
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "15432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  files:
  db-data: