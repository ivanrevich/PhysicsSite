version: '3.8'
services:
  client-frontend:
    image: frontend:0.0.1
    build: ./frontend/
    restart: always
    ports:
      - '3005:3005'
    volumes:
      - /frontapp/node_modules
      - ./frontend:/frontapp

  client-backend:
    image: backend:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - service-db
    environment:
      - SERVER_PORT = 8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://service-db/books_db
    volumes:
      - files:src/main/resources/static/files

  service-db:
    image: postgres:14.7-alpine
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "15432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  files:
  db-data:
  pgadmin-data: