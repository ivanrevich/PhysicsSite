version: "3.8"
services:
  client-frontend:
    image: frontend:0.0.1
    build:
      context: ./frontend/
      dockerfile: ./frontend/Dockerfile.second
    restart: always
    ports:
      - '3005:3005'
    volumes:
      - /frontapp/node_modules
      - ./frontend:/frontapp
  client-backend:
    image: backend:0.0.1
    build:
      context: .
      dockerfile: Dockerfile.second
    ports:
      - "8080:8080"
    depends_on:
      - service-db
    environment:
      - SERVER_PORT = 8080
    volumes:
      - files:src/main/resources/static/files
volumes:
  files: