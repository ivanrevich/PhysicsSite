version: "3.8"
services:
  client-frontend:
    image: frontend:0.0.1
    build: ./frontend
    restart: always
    ports:
      - 3005:3005
    volumes:
      - /app/node_modules
      - ./frontend:/app
  client-backend:
    image: backend:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      - SERVER_PORT = 8080
    volumes:
      - files:/app/src/main/resources/static/files
volumes:
  files: